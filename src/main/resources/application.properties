spring.application.name=travel

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
quotation.currency=${QUOTATION_CURRENCY:USD}
document.ai.base-url=${DOCUMENT_AI_BASE_URL:http://localhost:8000}
document.ai.internal-service-key=${DOCUMENT_AI_INTERNAL_SERVICE_KEY:}
document.storage.local-root=${DOCUMENT_STORAGE_LOCAL_ROOT:./document-storage}
document.validation.date-tolerance-days=${DOCUMENT_DATE_TOLERANCE_DAYS:0}
document.validation.fuzzy-threshold=${DOCUMENT_FUZZY_THRESHOLD:0.8}
